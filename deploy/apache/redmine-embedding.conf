# Apache 2.4 リバースプロキシ例（TLS 終端は Apache）。既存の 443 の VirtualHost 内に追記する。
# 必要なモジュール: proxy, proxy_http（mod_proxy_http）
# 書き換える箇所: 127.0.0.1:8001（MCP の待受ポート = settings の mcp_port）、/mcp-search（= mcp_public_path）。
# 公開 URL は mcp_public_base_url（例 https://redmine.example.com）+ mcp_public_path に一致させる。
#
# 注意（前置一致）: ProxyPass は前置一致で、先に書いた行が優先される。
# 同じ VirtualHost の既存 Redmine MCP 等が `ProxyPass /mcp ...` を持つと、`/mcp-search` もそれに飲み込まれる。
# 回避: 本ファイルの行を、既存の `/mcp` `/.well-known/oauth-*` `/authorize` などの「より前」に書く。
# あるいは public_path を `/mcp` で始まらない名前にする。
# 適用前に `apachectl configtest`、反映は `apachectl graceful`。

<VirtualHost *:443>
  # ... 既存の設定（ServerName, SSL など）...

  # ストリーミング応答を溜めない（flushpackets=on）、長時間接続を許す（timeout 秒）。
  # MCP エンドポイントと、OAuth のエンドポイント（/mcp-search/authorize, /token, /register, /revoke,
  # /consent, /oauth/callback）は /mcp-search 配下なので 1 行で通る。
  ProxyPass /mcp-search http://127.0.0.1:8001/mcp-search flushpackets=on timeout=3600

  # OAuth のメタデータ（RFC 9728 / RFC 8414）。パスの末尾に public_path が付く形で公開される。
  ProxyPass /.well-known/oauth-protected-resource/mcp-search http://127.0.0.1:8001/.well-known/oauth-protected-resource/mcp-search
  ProxyPass /.well-known/oauth-authorization-server/mcp-search http://127.0.0.1:8001/.well-known/oauth-authorization-server/mcp-search

  # 圧縮するとストリームが止まるので無効にする。
  SetEnvIf Request_URI "^/mcp-search" no-gzip=1

  # ProxyPassReverse は不要（本サーバーは絶対 URL を mcp_public_base_url から作る）。
  # ProxyPreserveHost On を使う場合も、サーバー側は Host ヘッダではなく設定値で動く。

  # ... 既存の ProxyPass / など（本ファイルの行より後ろ）...
</VirtualHost>
