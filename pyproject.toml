[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "redmine-embedding"
version = "0.1.0"
description = "Vector search (RAG) for Redmine: sync batch and MCP server"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = [
    # common: Redmine client, settings, pgvector access
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "numpy>=1.26",
    # settings JSON validation (MIT)
    "jsonschema>=4.21",
]

[project.optional-dependencies]
batch = [
    "sentence-transformers>=3.0",
    # attachment text extraction: pypdf BSD-3-Clause, openpyxl MIT. Lazily imported.
    "pypdf>=6.21",
    "openpyxl>=3.1.5",
]
mcp = [
    "sentence-transformers>=3.0",
    # MCP SDK (official, MIT). v2: MCPServer + Streamable HTTP
    "mcp>=2.3,<3",
    # encryption of stored upstream tokens: Fernet. Apache-2.0 OR BSD-3-Clause; already installed via mcp (pyjwt[crypto])
    "cryptography>=42",
]
dev = ["pytest>=8"]

[project.scripts]
redmine-embedding-batch = "redmine_embedding.batch.__main__:main"
redmine-embedding-mcp = "redmine_embedding.mcp_server.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/redmine_embedding"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs a PostgreSQL+pgvector instance (set TEST_DATABASE_URL)"]
