# nginx リバースプロキシ例（TLS 終端は nginx）。既存の `server { listen 443 ssl; ... }` 内に追記する。
# 書き換える箇所: 127.0.0.1:8001（MCP の待受ポート = settings の mcp_port）、/mcp-search（= mcp_public_path）。
# 公開 URL は mcp_public_base_url（例 https://redmine.example.com）+ mcp_public_path に一致させる。
#
# 注意（前置一致）: 既存の Redmine MCP 等が同じ server で `location /mcp { ... }` を使うと、
# 前置一致のため `/mcp-search` がそちらに入る。nginx は「最長一致の prefix location」を選ぶので、
# 下の `location /mcp-search` を書けば既存の `/mcp` より優先される（書く順序は問わない）。
# ただし正規表現 location（~）や、`^~` 付きでより短い prefix の location が同じ server にあると、
# そちらが優先されて想定どおりにならない（`location /` は最長一致で負けるので問題ない）。反映後に確認する。
# 適用前に `nginx -t`、反映は `systemctl reload nginx`。

# --- 本サーバー（MCP + OAuth）。/mcp-search 配下に authorize / token / register / revoke / consent / oauth/callback が来る ---
location /mcp-search {
    proxy_pass http://127.0.0.1:8001;   # URI 部分を書かない（パスをそのまま渡す）
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
    # Streamable HTTP（SSE を含む）: バッファリングとキャッシュを切り、長時間の読み取りを許す。
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# --- OAuth のメタデータ（RFC 9728 / RFC 8414）。パスの末尾に public_path が付く ---
location = /.well-known/oauth-protected-resource/mcp-search {
    proxy_pass http://127.0.0.1:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location = /.well-known/oauth-authorization-server/mcp-search {
    proxy_pass http://127.0.0.1:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
